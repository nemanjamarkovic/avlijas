# GitHub Pages builds this site with Jekyll. Pages are plain HTML (no front matter),
# so Jekyll only copies files — this config keeps internal files off the public site.
# Note: setting these lists replaces Jekyll's defaults (which include .htaccess).
include: []
exclude:
  - "*.md"
  - templates
  - scripts
  - node_modules
  - package.json
  - package-lock.json
  - version.json
  - update-versions.js
  - .htaccess
  - netlify.toml
  - nginx.conf
  - web.config
  - _headers
  - process-form.php
